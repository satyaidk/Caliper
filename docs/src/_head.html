<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Caliper — Technical Documentation</title>
<style>
  /* Fonts are deliberately system-only. A PDF render that waits on Google
     Fonts either hangs or silently falls back, and neither is acceptable for
     a document that has to build reproducibly. */
  :root {
    --ink: #16181d;
    --ink-2: #3f454f;
    --ink-3: #6b7280;
    --rule: #dcdfe4;
    --rule-soft: #eceef1;
    --amber: #9a5400;
    --amber-bg: #fdf6ec;
    --blue: #1b5fa8;
    --green: #256d2b;
    --red: #b3261e;
    --violet: #5b3bb5;
    --code-bg: #f6f7f9;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: Consolas, "Cascadia Mono", "SF Mono", Menlo, monospace;
  }

  @page { size: A4; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    font-size: 10.5pt;
    line-height: 1.62;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* --- structure ---------------------------------------------------------- */
  .part, .chapter { break-before: page; }
  .cover, .toc { break-after: page; }
  h1, h2, h3, h4 { break-after: avoid; line-height: 1.25; }
  pre, table, figure, .box { break-inside: avoid; }
  p, li { orphans: 3; widows: 3; }

  h1 {
    font-size: 22pt; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 4pt;
  }
  h2 {
    font-size: 15pt; font-weight: 700; letter-spacing: -0.01em;
    margin: 22pt 0 6pt; padding-bottom: 4pt; border-bottom: 1.5px solid var(--ink);
  }
  h3 { font-size: 12pt; font-weight: 700; margin: 16pt 0 4pt; }
  h4 {
    font-size: 10.5pt; font-weight: 700; margin: 12pt 0 3pt;
    font-family: var(--mono); color: var(--amber);
  }
  p { margin: 0 0 8pt; }
  ul, ol { margin: 0 0 8pt; padding-left: 18pt; }
  li { margin-bottom: 3pt; }
  a { color: var(--blue); text-decoration: none; }

  .eyebrow {
    font-size: 8pt; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-3); margin: 0 0 2pt;
  }
  .lede { font-size: 11.5pt; color: var(--ink-2); margin-bottom: 14pt; }

  /* --- code --------------------------------------------------------------- */
  code {
    font-family: var(--mono); font-size: 9pt;
    background: var(--code-bg); padding: 0.5pt 3pt; border-radius: 2px;
  }
  pre {
    font-family: var(--mono); font-size: 8.6pt; line-height: 1.5;
    background: var(--code-bg); border: 1px solid var(--rule);
    border-left: 3px solid var(--ink-3);
    border-radius: 3px; padding: 8pt 10pt; margin: 8pt 0 10pt;
    overflow-x: hidden; white-space: pre-wrap; word-break: break-word;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  pre.file { border-left-color: var(--amber); }
  pre .c { color: var(--ink-3); font-style: italic; }   /* comment  */
  pre .s { color: var(--green); }                        /* string   */
  pre .k { color: var(--violet); font-weight: 600; }     /* keyword  */
  pre .n { color: var(--blue); }                         /* number   */
  pre .t { color: var(--amber); }                        /* type     */

  .caption {
    font-size: 8.5pt; color: var(--ink-3); margin: -6pt 0 12pt;
  }

  /* --- tables ------------------------------------------------------------- */
  table { width: 100%; border-collapse: collapse; margin: 8pt 0 12pt; font-size: 9.5pt; }
  th {
    text-align: left; font-size: 8pt; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); border-bottom: 1.5px solid var(--ink); padding: 4pt 6pt 4pt 0;
  }
  td { padding: 4pt 6pt 4pt 0; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  td code, th code { font-size: 8.6pt; }
  td:first-child { white-space: nowrap; }
  table.wrap td:first-child { white-space: normal; }

  /* --- callouts ----------------------------------------------------------- */
  .box {
    border: 1px solid var(--rule); border-left: 3px solid var(--amber);
    background: var(--amber-bg); border-radius: 3px;
    padding: 8pt 11pt; margin: 10pt 0 12pt; font-size: 9.5pt;
  }
  .box p:last-child { margin-bottom: 0; }
  .box .tag {
    display: block; font-size: 8pt; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--amber); margin-bottom: 3pt;
  }
  .box.warn { border-left-color: var(--red); background: #fdf2f1; }
  .box.warn .tag { color: var(--red); }
  .box.note { border-left-color: var(--blue); background: #f1f6fc; }
  .box.note .tag { color: var(--blue); }

  /* --- cover -------------------------------------------------------------- */
  .cover { padding-top: 42mm; }
  .cover .rule { height: 3px; background: var(--ink); width: 54mm; margin-bottom: 10mm; }
  .cover h1 { font-size: 40pt; letter-spacing: -0.035em; line-height: 1.02; }
  .cover .sub { font-size: 14pt; color: var(--ink-2); margin-top: 6pt; max-width: 120mm; }
  .cover .meta {
    margin-top: 26mm; font-family: var(--mono); font-size: 9pt; color: var(--ink-3);
    border-top: 1px solid var(--rule); padding-top: 6pt;
  }
  .cover .meta div { margin-bottom: 2pt; }
  .cover .dimline { margin-top: 14mm; }

  /* --- table of contents -------------------------------------------------- */
  .toc ol { list-style: none; padding-left: 0; counter-reset: part; }
  .toc > ol > li { margin-bottom: 10pt; }
  .toc .ptitle {
    font-weight: 700; font-size: 11pt; border-bottom: 1px solid var(--rule);
    padding-bottom: 3pt; margin-bottom: 4pt;
  }
  .toc ol ol { padding-left: 0; margin-top: 3pt; }
  .toc ol ol li { font-size: 9.5pt; color: var(--ink-2); margin-bottom: 1.5pt; }
  .toc .num { font-family: var(--mono); color: var(--ink-3); margin-right: 6pt; }

  /* --- part title page ---------------------------------------------------- */
  .part { padding-top: 55mm; }
  .part .n {
    font-family: var(--mono); font-size: 11pt; color: var(--amber);
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .part h1 { font-size: 30pt; margin-top: 4pt; }
  .part p { font-size: 11.5pt; color: var(--ink-2); max-width: 115mm; margin-top: 8pt; }

  /* --- diagrams ----------------------------------------------------------- */
  figure { margin: 12pt 0; text-align: center; }
  figure svg { max-width: 100%; height: auto; }
  figcaption { font-size: 8.5pt; color: var(--ink-3); margin-top: 4pt; text-align: left; }

  .tree {
    font-family: var(--mono); font-size: 8.6pt; line-height: 1.55;
    background: var(--code-bg); border: 1px solid var(--rule);
    border-radius: 3px; padding: 9pt 11pt; margin: 8pt 0 12pt;
    white-space: pre;
  }
  .tree b { color: var(--amber); font-weight: 600; }
  .tree i { color: var(--ink-3); font-style: normal; }

  .kbd {
    font-family: var(--mono); font-size: 8.4pt; border: 1px solid var(--rule);
    border-bottom-width: 2px; border-radius: 3px; padding: 0 3pt; background: #fff;
  }
  .lead-in { font-weight: 600; }
</style>
</head>
<body>
