[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path serves the shell, and the client sorts it out.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers live in public/_headers so Cloudflare Pages picks up the same file.
